services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ecovia-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  mongo:
    image: mongo:7.0
    container_name: ecovia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecovia-backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/ecovia
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_CLIENT_ID=ecovia-backend-srv
      - SITE_ID=kho-bd
      - API_KEY=ecovia_secret_key_2026
    depends_on:
      - mosquitto
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecovia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  mosquitto_log:
  mongo_data:
